name: Build miniapp
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pointwise:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check pointwise arithmetic with ASan and UBSan
        # Runner tools: Node 20+, Python 3, CMake, GCC/G++, Make, Git and curl.
        # Source archives and the upstream patch are verified by the lock helper;
        # no model download, board firmware build, camera or audio is involved.
        run: python3 scripts/test-pose-pointwise.py --jobs 2
      - name: Upload pointwise validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pose-pointwise-regression
          include-hidden-files: true
          path: |
            .cache/pose-pointwise-ci/setup.log
            .cache/pose-pointwise-ci/build.log
            .cache/pose-pointwise-ci/pointwise-test.log
            .cache/pose-pointwise-ci/pointwise-report.json
          if-no-files-found: warn
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned official SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/setup.ps1 -SdkOnly
      - name: Validate and build Lua miniapp
        run: ./scripts/build.ps1
      - name: Check gameplay, voice, rendering and local services
        run: ./scripts/test.ps1
      - name: Check native motion state machines with synthetic landmarks
        run: |
          ./scripts/test-motion.ps1 -Compiler clang
          ./scripts/test-pose-image.ps1 -Compiler clang
          ./scripts/test-pose-decode.ps1 -Compiler clang
          ./scripts/test-pose-resources.ps1 -Compiler clang
          ./scripts/test-pose-session.ps1 -Compiler clang
          ./scripts/test-pose-worker.ps1 -Compiler clang
      - name: Check offline voice assets and standalone persistence
        run: |
          node --test --test-reporter=dot tests/native-voice-pack.test.cjs tests/standalone-overlay.test.cjs tests/native-image.test.cjs tests/pose-resources.test.cjs tests/setup-pose-source.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Standalone asset tests failed.' }
          ./scripts/test-standalone-storage.ps1 -Compiler clang
      - name: Upload application and rendered preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ricestep-miniapp
          path: dist/
          if-no-files-found: error
